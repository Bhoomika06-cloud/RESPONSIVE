<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Perfect Car — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:"Poppins",sans-serif}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background:linear-gradient(135deg,#cce7ff,#e8f7ff);
      position:relative;
      color:#00334e;
    }
    body::before{
      content:"";
      position:absolute;inset:0;
      background:
        linear-gradient(rgba(255,255,255,0.65),rgba(255,255,255,0.7)),
        url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80");
      background-size:cover;background-position:center;z-index:-1;filter:brightness(90%) blur(1px);
    }
    .quote{
      font-family:"Playfair Display", serif;
      font-weight:700;
      font-size:40px;
      color:#0a2a3f;
      text-align:center;
      margin-bottom:32px;
      text-shadow:1px 1px 6px rgba(255,255,255,0.5);
      z-index:2;
      line-height:1.2;
    }
    .container{
      z-index:2;
      width:90%;
      max-width:420px;
      background:rgba(255,255,255,0.62);
      padding:40px;
      border-radius:16px;
      box-shadow:0 0 25px rgba(0,85,170,0.2);
      text-align:center;
      backdrop-filter:blur(8px);
    }
    .container h1{font-size:32px;color:#005b96;margin-bottom:6px}
    .container h2{color:#00b894;font-size:18px;margin-bottom:12px;text-transform:uppercase}
    form{display:flex;flex-direction:column;gap:12px;margin-top:8px}
    input{padding:12px;border-radius:8px;border:none;background:rgba(255,255,255,0.9);outline:none;font-size:15px;color:#00334e}
    input:focus{box-shadow:0 0 10px rgba(0,153,255,0.25)}
    button{padding:12px;border-radius:8px;border:none;background:#00b894;color:#fff;font-weight:600;cursor:pointer}
    .error{color:#e63946;font-size:14px;margin-top:8px;display:none}
    @media(max-width:600px){.quote{font-size:26px;margin-bottom:18px}.container{padding:28px}}
  </style>
</head>
<body>
  <div class="quote">“Every road leads to a story — make yours unforgettable.”</div>

  <div class="container">
    <h1>My Perfect Car</h1>
    <h2>Login</h2>
    <p style="color:#004f71;margin:0 0 14px 0">Step into style and performance — your journey begins here.</p>

    <form onsubmit="validateLogin(event)" novalidate>
      <input type="text" id="username" placeholder="Username" required />
      <input type="text" id="contact" placeholder="Phone number or Email ID" required />
      <button type="submit">Login</button>
      <div id="error-msg" class="error">Please enter a valid 10-digit phone number or a valid email address.</div>
    </form>
  </div>

  <script>
    function validateLogin(evt){
      evt.preventDefault();

      const contactInput = document.getElementById('contact');
      const usernameInput = document.getElementById('username');
      const errorMsg = document.getElementById('error-msg');

      const raw = contactInput.value || "";
      const normalized = raw.replace(/[\s\-\u00A0()]/g, '');

      const phoneRegex = /^[6-9]\d{9}$/;                
      const emailRegex = /^[\w.-]+@[\w.-]+\.\w{2,}$/;  

      if (phoneRegex.test(normalized) || emailRegex.test(normalized)) {
        try { localStorage.setItem('mpc_username', usernameInput.value.trim()); } catch(e){ }

        window.location.href = "home.html";
        return;
      }

      errorMsg.style.display = "block";
    }
    fetch("http://localhost:3000/api/auth/login", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    username: username,
    contact: contact
  })
});

  </script>
</body>
</html>
