    padding: 0;
    box-sizing: border-box;

  body {

      center/cover no-repeat fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #00334e;
  }

  header h1 {
    font-family: "Playfair Display", serif;
    color: #ffffff;
    font-size: 36px;
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }

  .car-details {
    background: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 20px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.25);
    text-align: center;
  }

  .car-details img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 15px;
    margin-bottom: 20px;
  }

  .car-info {
    text-align: left;
    margin-top: 10px;
    color: #00334e;
  }

  .car-info p {
    margin: 8px 0;
    font-size: 16px;
  }

  .car-info span {
    font-weight: 600;
    color: #005b96;
  }

  button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #00b894;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #009d7a;

</style>
